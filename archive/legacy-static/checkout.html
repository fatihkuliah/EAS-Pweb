<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Checkout MieME</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body style="font-family: Montserrat; background-color: #101010">
    <section class="order-page position-relative overflow-hidden">
      <div class="container position-relative z-1">
        <div class="row py-5">
          <div class="col-lg-8">
            <div class="judul-menu d-inline-block">Checkout</div>
            <p class="menu-tagline mt-3"><span>Data penerima pesanan</span><br />Lengkapi alamat dan catatan sebelum memilih metode pembayaran.</p>
          </div>
          <div class="col-lg-4 d-flex align-items-center justify-content-lg-end">
            <a href="order.html" class="order-back text-decoration-none">Ubah Keranjang</a>
          </div>
        </div>
        <div class="row pb-5">
          <div class="col-lg-7">
            <form class="form-box" id="checkoutForm">
              <div class="form-field"><label>Nama Penerima</label><input id="penerima" required /></div>
              <div class="form-field"><label>Nomor Telepon</label><input id="telepon" type="tel" required /></div>
              <div class="form-field"><label>Alamat Pengiriman</label><textarea id="alamat" rows="4" required></textarea></div>
              <div class="form-field"><label>Catatan Pesanan</label><textarea id="catatan" rows="3" placeholder="Opsional"></textarea></div>
            </form>
          </div>
          <div class="col-lg-5 mt-4 mt-lg-0">
            <div class="summary-box">
              <div id="checkoutItems"></div>
              <p class="mt-4 mb-0">Total Pembayaran</p>
              <h1 id="checkoutTotal">Rp0</h1>
              <button form="checkoutForm" type="submit">Pilih Pembayaran</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="mieme-app.js"></script>
    <script src="checkout.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Detail Pesanan MieME</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body style="font-family: Montserrat; background-color: #101010">
    <section class="order-page position-relative overflow-hidden">
      <img src="img/aboutus atas kanan.svg" alt="" class="aboutus-atas-kanan position-absolute z-0" />
      <img src="img/aboutus atas kiri.svg" alt="" class="aboutus-atas-kiri position-absolute z-0" />
      <div class="container position-relative z-1">
        <div class="row py-5">
          <div class="col-lg-8">
            <div class="judul-menu d-inline-block">Detail Pesanan</div>
            <p class="menu-tagline mt-3">
              <span>Cek pesanan anda</span>
              <br />
              Pastikan menu dan porsi sudah sesuai sebelum lanjut ke pembayaran.
            </p>
          </div>
          <div class="col-lg-4 d-flex align-items-center justify-content-lg-end">
            <a href="orders.html" class="order-back text-decoration-none">Riwayat Pesanan</a>
          </div>
        </div>

        <div class="row pb-5">
          <div class="col-lg-8">
            <div class="detail-box" id="detailList"></div>
          </div>
          <div class="col-lg-4 mt-4 mt-lg-0">
            <div class="summary-box">
              <p class="m-0">Total Pembayaran</p>
              <h1 id="detailTotal">Rp0</h1>
              <button id="bayarBtn">Lanjut Pembayaran</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="mieme-app.js"></script>
    <script src="detail-order.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  </body>
</html>
